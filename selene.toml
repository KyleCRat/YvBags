std = "wow"
exclude = [
    "Libs/LibStub/**",
    "Libs/CallbackHandler-1.0/**",
    "Libs/LibSharedMedia-3.0/**",
    # Library lint migrations are handled elsewhere and will be updated here later.
    "Libs/LibModernSettings-1.0/**",
    "Libs/LibPopupSlider-1.0/**",
    "Libs/LibSimpleDB-2.0/**",
    "Libs/LibSimpleDBProfiles-1.0/**",
    "Libs/LibYvSkins-1.0/**",
]

[lints]
# WoW exposes named frames, SavedVariables, and optional integrations through _G.
global_usage = "allow"
multiple_statements = "deny"

[config]
multiple_statements = { one_line_if = "allow" }
# Nested widget methods conventionally name their own receiver self.
shadowing = { ignore_pattern = "^(self$|_)" }
